spring.application.name=careflow-backend

server.port=8080

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/careflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:careflow_user}
spring.datasource.password=${DB_PASSWORD:CareFlow@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:CareFlowDevelopmentSecretKeyChangeThisBeforeProduction2026}

# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
